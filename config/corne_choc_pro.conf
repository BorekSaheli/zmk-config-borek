# Enable mouse emulation.
# CONFIG_ZMK_POINTING=y

# Change idle settings
# CONFIG_ZMK_IDLE_TIMEOUT=30000

# Deep sleep settings
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000

# Turn RGB off while idle (default 30s); it comes back on the next keypress.
# Saves a lot of battery during the 2h window before deep sleep kicks in.
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# Custom keyboard name (max. 16 characters)
CONFIG_ZMK_KEYBOARD_NAME="Boreks Corne"
