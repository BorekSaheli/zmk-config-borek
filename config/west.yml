manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  projects:
    - name: zmk
      remote: zmkfirmware
      # NOTE: pinned releases (<= v0.3.0, Aug 2025) predate ZMK's Zephyr 4.1
      # migration (Dec 2025) that this config's custom nice_view widgets rely
      # on, so they fail to build. Track main until a newer tag is released.
      revision: main
      import: app/west.yml
  self:
    path: config
